<div id="chat-box">
    <button onclick="sendMessage()">Post Text</button>
</div>

<script>
    // Function to send the message to the /chat endpoint
    function sendMessage() {
        var message = document.getElementById("content").value;
        if (message) {
            // Use fetch to call the REST API with chatid, input, and user
            fetch(`/embedding-insert`,{
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: message
                })
                .then(response => response.text())
                .then(data => {
                    alert("Data posted");
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        } else {
            alert('Please provide Message in json format!');
        }
    }
</script>
