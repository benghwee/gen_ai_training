<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Console and Chat Box</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        #console {
            background-color: #333;
            color: white;
            height: 300px;
            width: 100%;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }
        #chat-box {
            background-color: #fff;
            border: 1px solid #ccc;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #chat-box input, #chat-box button {
            padding: 10px;
            font-size: 16px;
            width: 100%;
        }
        .settingLabel {
            font-size: 11px;
        }
    </style>
</head>
<body>

<h2>Console</h2>
<div id="console">
    <p>Welcome to the test page.</p>
    <p>Type something in the chat box below to get result with scores </p>
</div>

<h2>Chat Box</h2>
<div id="chat-box">
    <label for="message"></label><input type="text" id="message" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    // Function to send the message to the /chat endpoint
    function sendMessage() {
        var message = document.getElementById("message").value;

        if (message) {
            var consoleDiv = document.getElementById("console");
            var p = document.createElement("p");
            p.textContent = "Question : " + message ; // The response will be the formatted chat message
            consoleDiv.appendChild(p);
            // Use fetch to call the REST API with chatid, input, and user
            fetch(`/embedding-search?input=${encodeURIComponent(message)}`,{
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json"
                    }
                })
                .then(response => response.text())
                .then(data => {
                    // Append the message to the console
                    var consoleDiv = document.getElementById("console");
                    var results =JSON.parse(data)
                    for(var index in results){
                        var p = document.createElement("p");
                        p.textContent = results[index];
                        consoleDiv.appendChild(p);
                    }
                    document.getElementById("message").value = ""; // Clear input field
                    consoleDiv.scrollTop = consoleDiv.scrollHeight; // Auto scroll to bottom
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        } else {
            alert('Please provide both Chat ID and Message!');
        }
    }
</script>

</body>
</html>
